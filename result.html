<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Kết quả — Tra cứu Điểm Thi THPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="screen screen-result active" aria-labelledby="result-title">
        <header class="topbar topbar--result" aria-label="Thanh điều hướng kết quả">
          <button class="back-button" id="back-button" type="button" aria-label="Quay lại trang tra cứu">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Quay lại tra cứu</span>
          </button>
          <div class="topbar-copy">
            <span>Kết quả chi tiết</span>
            <p id="result-sub">Số báo danh</p>
          </div>
        </header>

        <section class="result-grid">
          <div class="result-status" id="result-status" aria-live="polite"></div>

          <article class="candidate-card">
            <div class="candidate-card__top">
              <div class="candidate-avatar" aria-hidden="true"></div>
              <div>
                <span class="eyebrow">Thí sinh</span>
                <h2 id="result-name">—</h2>
              </div>
            </div>

            <div class="candidate-meta">
              <div>
                <span>Mã số thí sinh</span>
                <strong id="result-id">—</strong>
              </div>
              <div>
                <span>Ngày sinh</span>
                <strong id="result-birthdate">—</strong>
              </div>
              <div>
                <span>Địa chỉ</span>
                <strong id="result-address">—</strong>
              </div>
            </div>
          </article>

          <section class="scores-grid" aria-label="Bảng điểm" id="result-scores">
            <article class="score-card">
              <span>Toán</span>
              <strong class="score" id="result-math">—</strong>
            </article>
            <article class="score-card">
              <span>Văn</span>
              <strong class="score" id="result-literature">—</strong>
            </article>
            <article class="score-card">
              <span>Tiếng Anh</span>
              <strong class="score" id="result-english">—</strong>
            </article>
          </section>

          <button type="button" class="secondary-button result-mobile-button mobile-only" id="search-another">Tra cứu số khác</button>

          <footer class="page-footer desktop-only" aria-label="Chân trang">
            <div class="footer-brand">
              <div class="footer-logo" aria-hidden="true"></div>
              <div>
                <strong>ExamPoint Pro</strong>
                <p>© 2026 Hệ thống Tra cứu Điểm thi Quốc gia</p>
              </div>
            </div>
          </footer>
        </section>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
